<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière - Produtos</title>

    <link rel="stylesheet" href="/assets/css/style.css" />

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>

<header class="header">
      <nav class="navbar">
        <div class="nav-container">
          <div class="nav-logo">
            <h1>Lumière</h1>
          </div>
          <ul class="nav-menu">
            <li class="nav-item">
              <a href="index.html" class="nav-link">Início</a>
            </li>
            <li class="nav-item">
              <a href="produtos.html" class="nav-link">Produtos</a>
            </li>
            <li class="nav-item">
              <a href="index.html#sobre" class="nav-link">Sobre</a>
            </li>
            <li class="nav-item">
              <a href="index.html#contato" class="nav-link">Contato</a>
            </li>
          </ul>
          <div class="nav-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-shopping-bag"></i>
            <i class="fas fa-user"></i>
          </div>
          <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>
        </div>
      </nav>
    </header>


<section class="products-banner">
    <div class="banner-content">
        <h1>Nossos Produtos</h1>
        <p>Cosméticos premium para realçar sua beleza natural</p>
    </div>
</section>

<section class="products-page">
    <div class="container products-wrapper">

        <!-- Lateral filtros -->
        <aside class="filter-box">
            <h3>Filtros</h3>

            <div class="filter-group">
                <h4>Categoria</h4>
                <label><input type="checkbox" class="filter-category" value="maquiagem"> Maquiagem</label>
                <label><input type="checkbox" class="filter-category" value="skincare"> Skincare</label>
                <label><input type="checkbox" class="filter-category" value="kits"> Kits</label>
            </div>

            <div class="filter-group">
                <h4>Preço</h4>
                <label><input type="radio" name="preco" class="filter-price" value="0-50"> Até R$50</label>
                <label><input type="radio" name="preco" class="filter-price" value="50-100"> R$50 a R$100</label>
                <label><input type="radio" name="preco" class="filter-price" value="100-500"> Acima de R$100</label>
            </div>

            <button class="clear-filters">Limpar Filtros</button>
        </aside>

        <!-- Grid produtos -->
        <div class="products-grid" id="products-list">

            <div class="product-card" data-category="maquiagem" data-price="89">
                <div class="product-image">
                    <img src="/assets/imagens/ProdutosLumiere/Base.jpg" alt="Base" />
                </div>
                <div class="product-info">
                    <h3>Base Perfeita</h3>
                    <p class="product-price">R$ 89,90</p>
                    <button class="product-btn">Adicionar ao Carrinho</button>
                </div>
            </div>

            <div class="product-card" data-category="maquiagem" data-price="45">
                <div class="product-image">
                    <img src="/assets/imagens/ProdutosLumiere/Batom.jpg" alt="Batom" />
                </div>
                <div class="product-info">
                    <h3>Batom Lumi</h3>
                    <p class="product-price">R$ 45,90</p>
                    <button class="product-btn">Adicionar ao Carrinho</button>
                </div>
            </div>

            <div class="product-card" data-category="skincare" data-price="65">
                <div class="product-image">
                    <img src="/assets/imagens/ProdutosLumiere/BrumaFacial.jpg" alt="Bruma" />
                </div>
                <div class="product-info">
                    <h3>Bruma Facial</h3>
                    <p class="product-price">R$ 65,90</p>
                    <button class="product-btn">Adicionar ao Carrinho</button>
                </div>
            </div>

            <div class="product-card" data-category="kits" data-price="199">
                <div class="product-image">
                    <img src="/assets/imagens/ProdutosLumiere/KitCompleto.jpg" alt="Kit" />
                </div>
                <div class="product-info">
                    <h3>Kit Completo</h3>
                    <p class="product-price">R$ 199,90</p>
                    <button class="product-btn">Adicionar ao Carrinho</button>
                </div>
            </div>

        </div>
    </div>
</section>
<script src="/assets/js/produtos.js"></script>
<script src="/assets/js/script.js"></script>
</body>
</html>
